                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
        "401":
          description: Unauthenticated
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum-compatible personal access token
  schemas:
    AuthSignupPayload:
      type: object
      required:
        - invite_token
        - tenant_name
        - tenant_slug
        - name
        - email
        - password
        - password_confirmation
      properties:
        invite_token:
          type: string
          maxLength: 2048
        tenant_name:
          type: string
          maxLength: 255
        tenant_slug:
          type: string
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 1024
        password_confirmation:
          type: string
          minLength: 8
          maxLength: 1024
    AuthLoginPayload:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 1024
    AuthLogin:
      type: object
      required:
        - token_type
        - access_token
        - expires_at
        - user
        - tenant
      properties:
        token_type:
          type: string
          const: Bearer
        access_token:
          type: string
          description: Opaque id-prefixed personal access token returned once. Send as Authorization Bearer value.
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        user:
          $ref: "#/components/schemas/AuthUser"
        tenant:
          $ref: "#/components/schemas/AuthTenant"
    AuthPasswordForgotPayload:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    AuthPasswordForgotResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          const: If an account exists for this email, a password reset link has been sent.
    AuthPasswordResetPayload:
      type: object
      required:
        - email
        - token
        - password
        - password_confirmation
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        token:
          type: string
          maxLength: 2048
        password:
          type: string
          minLength: 8
          maxLength: 1024
        password_confirmation:
          type: string
          minLength: 8
          maxLength: 1024
    AuthPasswordChangePayload:
      type: object
      required:
        - current_password
        - password
        - password_confirmation
      properties:
        current_password:
          type: string
          minLength: 1
