<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分身AI — Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">分</span>
      <span class="brand-name">分身AI<span class="brand-sub">Admin</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
        Dashboard
      </a>
      <a href="#" class="nav-item" data-page="memories">
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 3h12M2 6h12M2 9h8M2 12h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Memories
      </a>
      <a href="#" class="nav-item nav-item--secret" data-page="secret">
        <svg viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Secret Memories
      </a>
      <div class="nav-divider"></div>
      <a href="#" class="nav-item" data-page="categories">
        <svg viewBox="0 0 16 16" fill="none"><path d="M1 4h5l2-3h7M1 8h7l2 3h5M1 12h3l2 3h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Categories
      </a>
      <a href="#" class="nav-item" data-page="tags">
        <svg viewBox="0 0 16 16" fill="none"><path d="M1 8L8 1h6v6L7 14a1.5 1.5 0 0 1-2 0L1 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="5" r="1" fill="currentColor"/></svg>
        Tags
      </a>
      <div class="nav-divider"></div>
      <a href="#" class="nav-item" data-page="health">
        <svg viewBox="0 0 16 16" fill="none"><path d="M1 8h2.5l2-5 2.5 10 2-7 1.5 2H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        API Health
      </a>
      <a href="#" class="nav-item" data-page="settings">
        <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Settings
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="tenant-badge">
        <span class="tenant-dot"></span>
        tenant_default
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-wrap">
    <header class="header">
      <div class="header-left">
        <h1 class="page-title" id="page-title">Dashboard</h1>
      </div>
      <div class="header-right">
        <div class="api-status" id="api-status-badge">
          <span class="status-dot status-dot--ok"></span>
          API OK
        </div>
        <div class="header-user">
          <div class="avatar">管</div>
          <span class="user-name">admin</span>
        </div>
      </div>
    </header>

    <main class="content" id="content">
      <!-- Pages rendered by JS -->
    </main>
  </div>

  <!-- ========== Modals ========== -->

  <!-- Memory Modal -->
  <div class="modal-backdrop hidden" id="memory-modal-backdrop">
    <div class="modal" id="memory-modal" role="dialog" aria-modal="true" aria-labelledby="memory-modal-title">
      <div class="modal-header">
        <h2 class="modal-title" id="memory-modal-title">記憶を作成</h2>
        <button class="btn-icon" id="memory-modal-close" aria-label="閉じる">
          <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field form-field--full">
            <label for="f-title">タイトル</label>
            <input type="text" id="f-title" class="input" placeholder="記憶のタイトル">
          </div>
          <div class="form-field form-field--full">
            <label for="f-body">本文</label>
            <textarea id="f-body" class="input textarea" rows="4" placeholder="出来事の詳細を記録してください"></textarea>
          </div>
          <div class="form-field">
            <label for="f-period">時期</label>
            <select id="f-period" class="input select">
              <option value="">選択してください</option>
              <option value="childhood">幼少期</option>
              <option value="elementary_school">小学校</option>
              <option value="junior_high">中学校</option>
              <option value="high_school">高校</option>
              <option value="university">大学</option>
              <option value="adult">社会人</option>
            </select>
          </div>
          <div class="form-field">
            <label for="f-occurred">発生日</label>
            <input type="date" id="f-occurred" class="input">
          </div>
          <div class="form-field">
            <label for="f-emotion">感情</label>
            <select id="f-emotion" class="input select">
              <option value="">選択してください</option>
              <option value="嬉しい">嬉しい</option>
              <option value="普通">普通</option>
              <option value="不安">不安</option>
              <option value="悲しい">悲しい</option>
            </select>
          </div>
          <div class="form-field">
            <label for="f-intensity">感情強度</label>
            <select id="f-intensity" class="input select">
              <option value="1">1 — 微弱</option>
              <option value="2">2 — 弱</option>
              <option value="3" selected>3 — 中</option>
              <option value="4">4 — 強</option>
              <option value="5">5 — 最強</option>
            </select>
          </div>
          <div class="form-field">
            <label for="f-category">カテゴリ</label>
            <select id="f-category" class="input select">
              <option value="">未分類</option>
              <option value="cat_01">家族</option>
              <option value="cat_02">学校</option>
              <option value="cat_03">仕事</option>
              <option value="cat_04">人間関係</option>
            </select>
          </div>
          <div class="form-field">
            <label for="f-visibility">公開範囲</label>
            <select id="f-visibility" class="input select">
              <option value="private">private</option>
              <option value="shared">shared</option>
              <option value="secret">secret</option>
            </select>
          </div>
          <div class="form-field form-field--full">
            <label for="f-tags">タグ <span class="label-hint">カンマ区切り</span></label>
            <input type="text" id="f-tags" class="input" placeholder="友達, 夏, 放課後">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn--ghost" id="memory-modal-cancel">キャンセル</button>
        <button class="btn btn--primary" id="memory-modal-save">保存</button>
      </div>
    </div>
  </div>

  <!-- Detail Drawer -->
  <div class="drawer-backdrop hidden" id="drawer-backdrop">
    <div class="drawer" id="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-header">
        <h2 class="drawer-title" id="drawer-title">記憶の詳細</h2>
        <button class="btn-icon" id="drawer-close" aria-label="閉じる">
          <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawer-body">
        <!-- populated by JS -->
      </div>
      <div class="drawer-footer">
        <button class="btn btn--ghost btn--danger" id="drawer-delete">削除</button>
        <button class="btn btn--primary" id="drawer-edit">編集</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-backdrop hidden" id="delete-modal-backdrop">
    <div class="modal modal--sm" id="delete-modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title">削除の確認</h2>
      </div>
      <div class="modal-body">
        <p class="confirm-text">この操作は取り消せません。本当にこの記憶を削除しますか？</p>
        <p class="confirm-target" id="delete-confirm-target"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn--ghost" id="delete-cancel">キャンセル</button>
        <button class="btn btn--danger" id="delete-confirm">削除する</button>
      </div>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="modal-backdrop hidden" id="category-modal-backdrop">
    <div class="modal modal--sm" id="category-modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title" id="category-modal-title">カテゴリを作成</h2>
        <button class="btn-icon" id="category-modal-close" aria-label="閉じる">
          <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field form-field--full">
            <label for="cat-name">カテゴリ名</label>
            <input type="text" id="cat-name" class="input" placeholder="家族">
          </div>
          <div class="form-field form-field--full">
            <label for="cat-slug">スラッグ</label>
            <input type="text" id="cat-slug" class="input" placeholder="family">
          </div>
          <div class="form-field form-field--full">
            <label for="cat-sort">並び順</label>
            <input type="number" id="cat-sort" class="input" value="0" min="0">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn--ghost" id="category-modal-cancel">キャンセル</button>
        <button class="btn btn--primary" id="category-modal-save">保存</button>
      </div>
    </div>
  </div>

  <!-- Merge Tags Modal -->
  <div class="modal-backdrop hidden" id="merge-modal-backdrop">
    <div class="modal modal--sm" id="merge-modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title">タグをマージ</h2>
        <button class="btn-icon" id="merge-modal-close" aria-label="閉じる">
          <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="form-hint">マージ元タグの記憶は、マージ先タグに統合されます。マージ元は削除されます。</p>
        <div class="form-grid">
          <div class="form-field form-field--full">
            <label for="merge-from">マージ元タグ</label>
            <select id="merge-from" class="input select"></select>
          </div>
          <div class="merge-arrow">→</div>
          <div class="form-field form-field--full">
            <label for="merge-to">マージ先タグ（存続）</label>
            <select id="merge-to" class="input select"></select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn--ghost" id="merge-modal-cancel">キャンセル</button>
        <button class="btn btn--danger" id="merge-modal-confirm">マージ実行</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
